# version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
      - CHROMA_SERVER_HOST=chromadb
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
      - OTEL_PROJECT_NAME="RAGBOT_API"
    networks:
      - chatbot_network
    depends_on:
      chromadb:
        condition: service_started
      phoenix:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - app-db:/app/db
      - rag_data:/app/data_directory # Shared volume for files

  ingestion-pool:
    build:
      context: ./ingestion_pool
      dockerfile: Dockerfile
    container_name: ingestion_pool
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
      - CHROMA_SERVER_HOST=chromadb
      - DATA_DIRECTORY=/app/data_directory
    networks:
      - chatbot_network
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - app-db:/app/db
      - rag_data:/app/data_directory # Shared volume for files

  worker-pool:
    build: worker_pool
    command: python main.py
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
      - CHROMA_SERVER_HOST=chromadb
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
      - PYTHONPATH=/app
      - DATA_DIRECTORY=/app/data_directory
    networks:
      - chatbot_network
    depends_on:
      chromadb:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    deploy:
      replicas: 1
    volumes:
      - app-db:/app/db
      - rag_data:/app/data_directory # Shared volume for files
      - ./worker_pool:/app

  evaluation-pool:
    build:
      context: ./evaluation_pool
      dockerfile: Dockerfile
    container_name: evaluation_pool
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - DATA_DIRECTORY=/app/data_directory
    networks:
      - chatbot_network
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - app-db:/app/db
      - rag_data:/app/data_directory
      - ./synthetic_data_kit:/opt/conda/lib/python3.11/site-packages/synthetic_data_kit
      - ./data:/app/data
      - ./evaluation_pool:/app
      - ./Backend/models:/app/models # Map models directory for import compatibility

  video-processing-pool:
    build:
      context: ./video_processing_pool
      dockerfile: Dockerfile
    container_name: video_processing_pool
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=db
      - CHROMA_SERVER_HOST=chromadb
      - DATA_DIRECTORY=/app/data_directory
      - OUTPUT_DIR=/app/data_directory/video_output
      - TEMP_DIR=/app/data_directory/video_temp
      - GRAPH_DIR=/app/data_directory/video_graphs
    networks:
      - chatbot_network
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - rag_data:/app/data_directory
      - video_graph_data:/app/data_directory/video_graphs

  frontend:
    build:
      context: ./Frontend/docu-chatter-main
      dockerfile: Dockerfile
    container_name: rag_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./Frontend/docu-chatter-main:/app
      - /app/node_modules
    env_file: .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - chatbot_network

  chromadb:
    image: chromadb/chroma
    ports:
      - "8001:8000"
    # environment:
    #   - IS_PERSISTENT=TRUE
    #   - PERSIST_DIRECTORY=/data
    volumes:
      - chroma_data:/data
    networks:
      chatbot_network:
        aliases:
          - chromadb

  phoenix:
    image: arizephoenix/phoenix
    ports:
      - "6006:6006"
      - "4317:4317" # OTLP gRPC collector
      - "9090:9090"
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_GRPC_PORT=4317
      - PHOENIX_WORKING_DIR=/mnt/data

    volumes:
      - phoenix_data:/mnt/data
    networks:
      chatbot_network:
        aliases:
          - phoenix

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    networks:
      chatbot_network:
        aliases:
          - redis
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatbot_db
    networks:
      chatbot_network:
        aliases:
          - db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d chatbot_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  chatbot_network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  phoenix_data:
    driver: local
  app-db:
  rag_data: # New shared volume
  video_graph_data:
    driver: local
